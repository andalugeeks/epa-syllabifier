[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epa_syllabifier"
version = "0.4.0"
description = "Automatic syllabification module for EPA words and texts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Andalugeeks Team" }
]
keywords = ["syllabification", "spanish", "nlp", "text-processing", "linguistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
epa-syllabifier = "epa_syllabifier.cli:main"

[project.urls]
"Homepage" = "https://github.com/andalugeeks/epa-syllabifier"
"Bug Tracker" = "https://github.com/andalugeeks/epa-syllabifier/issues"
"Repository" = "https://github.com/andalugeeks/epa-syllabifier.git"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build",
    "ipdb",
    "black",
    "commitizen>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "properties: exhaustive invariants over EPA alphabet combinations",
]

[tool.black]
target-version = ["py310"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
